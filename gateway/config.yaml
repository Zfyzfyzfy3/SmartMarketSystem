server:
	addr: ":8080"
	readTimeout: 5s
	writeTimeout: 10s
	idleTimeout: 60s

etcd:
	endpoints:
		- "http://127.0.0.1:2379"
	dialTimeout: 5s
	username: ""
	password: ""

services:
		- name: user-service
			scheme: http
			discoveryPrefix: "/services/user"
			prefixes:
				- "/api/v1/users"
				- "/api/v1/auth"
			# 开发约定：user-service 默认监听在 127.0.0.1:9001

	- name: product-service
		scheme: http
		discoveryPrefix: "/services/product"
		prefixes:
				- "/api/v1/products"
			# 开发约定：product-service 默认监听在 127.0.0.1:9002

	- name: cart-service
		scheme: http
		discoveryPrefix: "/services/cart"
		prefixes:
				- "/api/v1/carts"
			# 开发约定：cart-service 默认监听在 127.0.0.1:9003

		- name: order-service
			scheme: http
			discoveryPrefix: "/services/order"
			prefixes:
				- "/api/v1/orders"
			# 开发约定：order-service 默认监听在 127.0.0.1:9004

	- name: inventory-service
		scheme: http
		discoveryPrefix: "/services/inventory"
		prefixes:
				- "/api/v1/inventory"
			# 开发约定：inventory-service 默认监听在 127.0.0.1:9006

	- name: promotion-service
		scheme: http
		discoveryPrefix: "/services/promotion"
		prefixes:
				- "/api/v1/seckills"
			# 开发约定：promotion-service 默认监听在 127.0.0.1:9007

	- name: ai-service
		scheme: http
		discoveryPrefix: "/services/ai"
		prefixes:
				- "/api/v1/ai"
			# 开发约定：ai-service 默认监听在 127.0.0.1:9008
